schema_version = 2

[board]
name = "hawaii"
soc = "UMS9230"
soc_source = "ums9230"
os_profile = "ipados-17.7.11-21H461"
kit = "hawaii"
description = "Motorola Moto E32 (XT2227-1), Unisoc UMS9230 / Tiger T606"

[components]
# Minimal first-bring-up set, same shape as UniXNU-eebbk-a2_x2-ums512 (UMS512).
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "XnuPrelink",
  "DarwinBoot",
]

[kernel]
defconfig = "hawaii_defconfig"
config_fragments = [
  "arch:configs/common.config",
  "soc:configs/ums9230.config",
  "os:configs/ipados.config",
]
# XNU patch series applied in order: arch, soc, device.
patch_series = [
  "arch:patches/xnu/series",
  "soc:patches/xnu/series",
  "device:patches/xnu/series",
]

archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
]

[device_tree]
source = "device:dts/hawaii.dts"
include_dirs = ["soc:dts"]

[firmware]
config = "hawaii"
dsc = "Platforms/Unisoc/hawaiiPkg/hawaii.dsc"
fd = "Build/hawaiiPkg/{target}_CLANGDWARF/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{mu_plus}",
  "{mu_oem_sample}",
  "{uefi}/Platforms/Unisoc",
  "{uefi}/Silicon/Unisoc",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "hawaii"
ENABLE_SECUREBOOT = "0"
# ATENÇÃO: FD_BASE e FD_SIZE NÃO foram validados no hardware real.
# Valores provisórios extraídos de uboot_a.bin; devem ser confirmados
# com /proc/iomem e /proc/meminfo do dispositivo antes de gravar.
FD_BASE = "0x80800000"
FD_SIZE = "0x400000"

# Stock boot image parameters (Android header v2, parsed from boot_b):
#   header_version 2, pagesize 2048, kernel_addr 0x8000, ramdisk_addr 0x5400000,
#   tags_offset 0x100, cmdline console=ttyS1,115200n8 buildvariant=user
# ATENÇÃO: Estes parâmetros foram extraídos do boot_b original. O cabeçalho
# Android v2 deve ser montado seguindo a especificação AOSP.
[bootimg.image]
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x5400000
tags_offset = 0x100
pagesize = 2048
header_version = 2
kernel_size = 0x182f010
ramdisk_size = 0x8f53fd
[payload]
volume = "UNIXNU"
# ATENÇÃO: 192 MiB excede o tamanho da partição boot (64 MiB).
# Para o primeiro teste, usar 8 MiB. Ajustar conforme o tamanho real do XNU.
size_mib = 8
loader = "firmware"
title = "UniXNU"
dram_size = "0x80000000"
panic_screen = true
skip_setup_tool = "scripts/seed-data-skip-setup.py"
timeout = 3
tools = true

kernel_args = ["-v", "serial=3", "boot-progress=1", "build-tag=hawaii-001"]

[payload.adt]
chip_id = "0"
owned_memory_size = "0x10000000"
root_match_volume_uuid = "REQUIRED_ROOT_VOLUME_UUID"
cpu_regs = "0,0x100"
psci_method = "smc"
packed_data_ramdisk = true
ipad_identity = true
unique_chip_id = "required"
