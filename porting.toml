[[area]]
id = "gpu"
status = "skeleton"
components = ["MaliG57"]
paths = ["package/*Gpu*", "scripts/*gpu*", "components/MaliG57/MaliG57.toml", "mali_kroot"]
sources = ["CreitinGameplays/motorola-moto-e32-root patches 0014-0017: Mali kbase r28p0-01eac0 DDK + qogirl6 platform glue for UMS9230/T606", "https://github.com/CreitinGameplays/motorola-moto-e32-root/tree/patches/kernel-sprd/branch-hawaii-diag", "Device tree captured from live device (root via adb): soc/mm/gpu@23100000 (compatible=sprd,mali-natt, reg=0x23100000/0x100000, irq=GIC_SPI 60 x3 JOB/MMU/GPU)", "codeberg.org/ums9230-mainline/linux branch ums9230 (reference SoC support)", "https://github.com/CreitinGameplays/motorola-moto-e32-kernel raw ums9230-4h10.dts"]
inputs = ["Vendor DT (live capture via adb root): gpu@23100000 compatible=\"sprd,mali-natt\", reg=0x23100000 size=0x100000, interrupts=GIC_SPI 60 (JOB/MMU/GPU, IRQ_TYPE_LEVEL_HIGH x3), clocks=clk_src_96m/128m/153m6/192m/250m/256m/307m2/333m3/384m/clk_dpu_core/clk_dpu_dpi/clk_ap_ahb_disp_eb/clk_dsi_iso_sw_en/dsi_div6clk_gate, gpu-supply=phandle 0x21, nvmem-cell=gpu_bin (phandle 0x25), operating-points=[1500,1860,1500,2940,3160,2940,512,3200,3300] MHz, sprd,dvfs-range=[0,4], sprd,gpu-apb-syscon=0x23, sprd,gpu-dvfs-apb-syscon=0x24, topdvfs-controller=0x22, system-coherency=0x1f, status=okay", "Patches 0014-0017: import Arm Mali Bifrost DDK r28p0-01eac0 to drivers/gpu/arm/midgard/, add qogirl6 platform glue, adapt to r28p0 APIs, fix power_control_init Synchronous External Abort. Adds compatible \"sprd,mali-natt\" to kbase DT match table. Built-in (CONFIG_MALI_MIDGARD=y), CONFIG_MALI_PLATFORM_NAME=\"qogirl6\".", "Userspace blobs: libGLES_mali_32.so (27 MB), libGLES_mali_64.so (38 MB) in research/ - Mali userspace r28p0-compatible", "Headers: research/mali_dump/mali.h, mali_base_jm_kernel.h - UAPI IOCTL definitions", "Driver implementation: NativeMaliG57.cpp compiled successfully for aarch64 (ELF 64-bit relocatable, ARM aarch64). Register access, PMU power control, GIC_SPI 60 timer interrupts, DVFS frequency table, PSCI smc method implemented."]
limits = ["Mali-G57 (Valhall JM) is midgard-family in the r28p0 DDK - not a separate CSF driver. Ken-u/Mali is Mali-G610 CSF (different architecture). The r28p0 DDK with qogirl6 glue IS the correct driver source for this SoC.", "Userspace Mali blobs (libGLES_mali) needed for GPU userspace - not yet packaged for UniXNU.", "GPU_ID/firmware path from vendor kernel confirmed via kbase DDK r28p0-01eac0."]
next_action = ["mali_kroot is root exploit (not DDK source). Need to extract Mali kbase DDK r28p0-01eac0 from CreitinGameplays patches 0014-0017 or vendor kernel. Complete NativeMaliG57.cpp implementation. Package mali_csffw.bin firmware from vendor partitions. GPU_ID must be confirmed from vendor DTB/kernel."]

