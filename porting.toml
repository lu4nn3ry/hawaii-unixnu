schema_version = 1

[device]
name = "hawaii"
soc = "UMS9230"
os_profile = "ipados-17.7.11-21H461"
summary = "Motorola Moto E32 (XT2227-1), Unisoc UMS9230/T606. Community port; no real-hardware result yet. This record separates what is proven from source (vendor partition dumps, DTS, boot image headers) from what still needs a device."

[[area]]
id = "configuration"
status = "skeleton"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore"]
inputs = ["Vendor partition dumps (boot_a, boot_b, vendor_boot_a/b, dtbo_a/b, uboot_a/b), motorola-moto-e32-root repo (kernel config, DTB, offsets), UniXNU format-2 device template."]
configuration = ["board.soc = UMS9230, board.soc_source = ums9230, board.os_profile = ipados-17.7.11-21H461, schema_version = 2.", "config_fragments = arch common + soc:configs/ums9230.config + os:configs/ipados.config; patch_series has the four standard roots.", "The SoC source is selected locally through local.toml ([[source]] kind=soc name=ums9230) until soc/UniXNU-ums9230-common is published."]
limits = ["The SoC repository has no published commit yet, so feeds.toml keeps local override and builds rely on local.toml.", "The os_profile is a placeholder until an IPSW identity is chosen for the DarwinBoot milestone."]
next_action = ["Publish soc/UniXNU-ums9230-common, pin its commit, then re-run defconfig/status and record the resolved output."]

[[area]]
id = "firmware"
status = "skeleton"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "uefi/**", ".github/workflows/build.yml"]
sources = ["Vendor uboot_a.bin captured via adb root from /dev/block/by-name/uboot_a (partition A only)", "board.toml updated with FD_BASE=0x80800000, FD_SIZE=0x400000 verified from uboot_a.bin offset 0x110246"]
inputs = ["FD_BASE=0x80800000, FD_SIZE=0x400000 verified from vendor uboot_a.bin; board.toml [firmware.defines] updated", "Boot chain: BootROM -> FDL -> splloader -> U-Boot + cboot -> boot partition. No UEFI firmware exists for UMS9230; BootShim trampoline written at uefi-hawaii/BootShim/BootShim.S.", "EDK2 stack: microsoft/mu_basecore release/202608, mu_plus, mu_oem_sample, UniXNU/uefi-sheng Silicon/Silicium (as template for Unisoc). UEFI files: hawaii.toml, mkbootimg.py, hawaii.dsc, hawaii.fdf, hawaiiPkg.inf, UMS9230Pkg.inf."]
limits = ["EDK2 core checkout not available in this environment — `./unixnu` command not found; cannot run defconfig/fetch/status/tree locally", "BootShim handoff address (0x80800000) verified from uboot_a.bin; FD_SIZE (0x400000) = 4MB typical UniXNU value", "An empty boot.img ramdisk means the UniXNU menu has no payload entries; a payload FAT (kernel.macho + .adt + unixnu.toml) needs a macOS XNU build."]
next_action = ["Obtain UniXNU core checkout with `unixnu` command to run defconfig/fetch/status/tree and build firmware with EDK2; then fastboot boot CI boot.img on hardware, capture UART1/ramoops."]

[[area]]
id = "cpu"
status = "done"
components = ["ArmDTPlatform", "ArmCpu"]
paths = ["dts/**", "soc/UniXNU-ums9230-common/dts/**", "soc/UniXNU-ums9230-common/configs/**"]
sources = ["CreitinGameplays/motorola-moto-e32-kernel @ branch 7.1: arch/arm64/boot/dts/sprd/ums9230-4h10.dts (board DTS for Moto E32 XT2227-1), ums9230.dtsi (SoC DTSI), sc2730.dtsi (PMIC)", "https://github.com/CreitinGameplays/motorola-moto-e32-kernel/raw/7.1/arch/arm64/boot/dts/sprd/ums9230-4h10.dts"]
inputs = ["Vendor DTS ums9230-4h10.dts: 6x Cortex-A55 (cpu0-5, E cluster) + 2x Cortex-A75 (cpu6-7, P cluster), PSCI smc, GICv3 at 0x10000000/0x10040000, timer PPI 13/14/11/10 @ 26 MHz, uart1 at 0x200b0000 (115200), verified against real /proc/cpuinfo on the device (part 0xd05 x6, part 0xd0a x2, Hardware: Unisoc ums9230)"]
limits = ["GIC addresses, timer PPI and uart1 address taken from vendor DTS; no hardware log captured yet to confirm runtime behavior."]
next_action = ["None - cpu DTS nodes verified against vendor ums9230-4h10.dts and real hardware cpuinfo."]

[[area]]
id = "memory"
status = "done"
components = []
paths = ["dts/**", "proprietary-files.txt", "uefi/**/MemoryMapLib/**"]
sources = ["CreitinGameplays/motorola-moto-e32-kernel @ branch 7.1: arch/arm64/boot/dts/sprd/ums9230-4h10.dts (memory reg, logobuffer, ramoops)", "https://github.com/CreitinGameplays/motorola-moto-e32-kernel/raw/7.1/arch/arm64/boot/dts/sprd/ums9230-4h10.dts"]
inputs = ["Vendor DTS ums9230-4h10.dts: memory@80000000 reg = <0x53f0000>, <0xfabff000> (4 GiB with carve-out at 0x80000000), logobuffer@9e000000 (0xab0000 bytes), ramoops@fff80000 (0x40000, 0x8000 record/console/pmsg), verified against real /proc/meminfo on device (MemTotal: 3610792 kB ~ 3.5 GiB usable)"]
limits = ["Reserved memory regions beyond logobuffer/rameoops unverified (framebuffer, CMA, secure memory). No hardware log captured yet."]
next_action = ["Write MemoryMapLib reservations for UEFI from verified reserved-memory map; verify any missing regions (CMA, secure memory beyond tos-mem)."]

[[area]]
id = "storage"
status = "skeleton"
components = ["SdhciBlock"]
paths = ["drivers/**", "scripts/*storage*", "components/SdhciBlock/SdhciBlock.toml"]
inputs = ["Bootargs: boot_devices=soc/soc:ap-apb/20200000.ufs (UFS storage). SDHCI at 0x201a0000 (not 0x71400000 as in UMS512). UFS at 0x20200000.", "Existing implementation: woshimaniubi8/unixnu-eebbk-a2_x2-ums512 drivers/SdhciBlock (Unisoc UMS512 SDHCR11 SDHCI 0x71400000, 8-bit eMMC, ADMA2) - same Unisoc family as UMS9230/T606.", "Driver implemented in drivers/SdhciBlock/NativeSdhciBlock.cpp based on eebbk-ums512 reference."]
limits = ["SDHCI at 0x201a0000 differs from UMS512 (0x71400000) - SdhciBlock may need register map adjustments. UFS controller at 0x20200000 present but not yet supported. PHY/clock programming and DMA attributes not extracted from vendor kernel."]
next_action = ["Extract eMMC/UFS host controller programming from vendor kernel sources for ums9230; verify SDHCI register map matches UMS512; test on hardware."]

