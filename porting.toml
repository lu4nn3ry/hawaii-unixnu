inputs = ["Vendor DTB (proc_device_tree_root): display-subsystem with dpu@31000000, dsi@31100000, panel (sprd,generic-mipi-panel), oled-backlight. Bootargs: lcd_name=lcd_nt36525c_boe_mipi_fhd, lcd_base=9e000000, lcd_size=1600x720. Vendor DTS ums9230-4h10.dts: display-timings 140.666 MHz, 720x1600, two modes. Panel timing added to hawaii.dts."]
